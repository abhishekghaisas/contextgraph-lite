services:
  - type: web
    name: contextgraph-lite-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USER
        value: cognodb
      - key: COGNODB_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
